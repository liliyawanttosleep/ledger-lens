<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流水分析助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ff0d6"/><stop offset="1" stop-color="#2a78d6"/>
    </linearGradient>
    <symbol id="logo" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="15" fill="#0e1622"/>
      <path d="M32 9C32 9 15 27.5 15 39.5a17 17 0 0 0 34 0C49 27.5 32 9 32 9Z" fill="url(#dropGrad)"/>
      <circle cx="32" cy="39.5" r="7.6" fill="none" stroke="#fff" stroke-width="4.6"/>
      <path d="M32 31.9a7.6 7.6 0 0 1 7.6 7.6" fill="none" stroke="#ffc24a" stroke-width="4.6"/>
    </symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2.2h5c.1-1 .5-1.700 1.100-2.200A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M12 4v10m0 0-4-4m4 4 4-4M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M2 12h2M20 12h2M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.500 6-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.500 6 6 6-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.500 6.500l4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 3 20h18zM12 10v4M12 17h.01"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.2"/><path d="M11 17.5h2"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.800 3 2.800 15 0 18M12 3c-2.800 3-2.800 15 0 18"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></symbol>
  </defs>
</svg>

<div id="app">
  <aside class="side">
    <div class="brand">
      <svg class="brand-logo"><use href="#logo"/></svg>
      <div><b>流水分析助手</b><span>LEDGER · LENS</span></div>
    </div>
    <nav id="nav">
      <button data-page="overview"><svg><use href="#i-home"/></svg>本月概览</button>
      <button data-page="analysis"><svg><use href="#i-chart"/></svg>收支分析</button>
      <button data-page="advice"><svg><use href="#i-bulb"/></svg>开销建议<i id="adviceBadge"></i></button>
      <button data-page="txns"><svg><use href="#i-list"/></svg>交易明细</button>
      <button data-page="sync"><svg><use href="#i-phone"/></svg>手机同步</button>
      <button data-page="imports"><svg><use href="#i-inbox"/></svg>导入与数据</button>
    </nav>
    <div class="side-foot">
      <label class="lang-pick"><svg><use href="#i-globe"/></svg><select id="langSel" title="语言 / Language"></select></label>
      <button id="themeBtn" class="ghost-btn"><svg><use href="#i-moon"/></svg><span>深色模式</span></button>
      <p>数据仅保存在本机</p>
    </div>
  </aside>

  <main>
    <header class="top">
      <div class="top-title"><h1 id="pageTitle">本月概览</h1><p id="pageSub"></p></div>
      <div class="top-actions">
        <div id="curSeg" class="seg"></div>
        <div id="monthNav" class="month-nav">
          <button id="mPrev" title="上个月"><svg><use href="#i-left"/></svg></button>
          <select id="mSel"></select>
          <button id="mNext" title="下个月"><svg><use href="#i-right"/></svg></button>
        </div>
        <button id="importBtn" class="btn primary"><svg><use href="#i-plus"/></svg>导入文件</button>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>

<div id="dropMask"><div><svg><use href="#i-inbox"/></svg><b>松开即可导入</b><span>PDF · 截图 · Excel · CSV · Word</span></div></div>
<div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<div id="toast"></div>

<script src="echarts.min.js"></script>
<script src="mobile/i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
