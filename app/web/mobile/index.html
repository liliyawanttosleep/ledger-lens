<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f5f4f0">
<meta name="mobile-web-app-capable" content="yes">
<title>流水分析助手</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="m.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="dropGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ff0d6"/><stop offset="1" stop-color="#2a78d6"/></linearGradient>
  <symbol id="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#0e1622"/><path d="M32 9C32 9 15 27.5 15 39.5a17 17 0 0 0 34 0C49 27.5 32 9 32 9Z" fill="url(#dropGrad)"/><circle cx="32" cy="39.500" r="7.600" fill="none" stroke="#fff" stroke-width="4.600"/><path d="M32 31.900a7.600 7.600 0 0 1 7.600 7.600" fill="none" stroke="#ffc24a" stroke-width="4.600"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.500 12 5l8 6.500V19a1 1 0 0 1-1 1h-4.500v-5h-5v5H5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.600 10.800c.6.5 1 1.200 1.100 2.200h5c.1-1 .5-1.700 1.100-2.200A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.500-4.500L4 8M4 4v4h4M4 13a8 8 0 0 0 14.500 4.500L20 16M20 20v-4h-4"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m14.500 6-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9.500 6 6 6-6 6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 3 20h18zM12 10v4M12 17h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
</defs></svg>

<header id="top">
  <div class="brand"><svg><use href="#logo"/></svg><b id="title">本月概览</b></div>
  <div id="monthNav"><button id="mPrev"><svg><use href="#i-left"/></svg></button><select id="mSel"></select><button id="mNext"><svg><use href="#i-right"/></svg></button></div>
</header>
<div id="status"></div>
<main id="content"></main>
<button id="fab" title="记一笔"><svg><use href="#i-plus"/></svg></button>
<nav id="tabs">
  <button data-tab="overview"><svg><use href="#i-home"/></svg>概览</button>
  <button data-tab="analysis"><svg><use href="#i-chart"/></svg>分析</button>
  <button data-tab="advice"><svg><use href="#i-bulb"/></svg>建议</button>
  <button data-tab="txns"><svg><use href="#i-list"/></svg>明细</button>
  <button data-tab="sync"><svg><use href="#i-sync"/></svg>同步</button>
</nav>
<div id="sheet" hidden><div id="sheetCard"></div></div>
<div id="toast"></div>
<script src="echarts.min.js"></script>
<script src="m.js"></script>
</body>
</html>
